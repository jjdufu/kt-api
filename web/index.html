<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>开天大模型 KTAPI</title>
    <meta name="title" content="开天大模型 KTAPI" />
    <link rel="icon" type="image/svg+xml" href="/logo-mono.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
  </head>

  <body>
    <!-- Apply the colour preset before first paint (default: kt-comic) so the
         console never flashes the neutral palette. Keep in sync with
         DEFAULT_THEME_CUSTOMIZATION / THEME_STORAGE_KEYS.preset. -->
    <script>
      ;(function () {
        // Removed presets (incl. the old 'default') migrate to 'underground'.
        // Keep in sync with migrateThemePreset() in lib/theme-customization.
        var preset = 'kt-comic'
        var keep = { 'kt-comic': 1, underground: 1, 'simple-large': 1 }
        try {
          var key = 'newapi:theme:v1:preset'
          var stored = localStorage.getItem(key)
          if (stored) {
            preset = keep[stored] ? stored : 'underground'
            if (preset !== stored) localStorage.setItem(key, preset)
          }
        } catch (e) {}
        document.body.setAttribute('data-theme-preset', preset)
        // KT Comic: preload the first-screen font slices (generated list,
        // see scripts/build-comic-fonts.py). Other presets fetch nothing.
        if (preset === 'kt-comic') {
          var fonts = [
            /*kt-comic-preload*/ '/fonts/kt-comic/display/000-84398194.woff2',
            '/fonts/kt-comic/kuaile/000-9433feee.woff2' /*end*/,
          ]
          for (var i = 0; i < fonts.length; i++) {
            var l = document.createElement('link')
            l.rel = 'preload'
            l.as = 'font'
            l.type = 'font/woff2'
            l.crossOrigin = 'anonymous'
            l.href = fonts[i]
            document.head.appendChild(l)
          }
        }
      })()
    </script>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
